# Worker singleton pre-flight check.
# Runs before every Worker deployment to ensure no autoscale rule or extra instance
# exists in the target App Service Plan. Fails the release if either is detected.

name: Worker Release Pre-flight

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    inputs:
      resource_group:
        required: true
        type: string
      app_service_plan:
        required: true
        type: string

jobs:
  singleton-preflight:
    name: Verify Worker Singleton Invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run singleton pre-flight script
        shell: pwsh
        run: |
          infra/azure/scripts/Test-WorkerSingletonPreflight.ps1 \
            -ResourceGroup "${{ inputs.resource_group }}" \
            -AppServicePlan "${{ inputs.app_service_plan }}"
