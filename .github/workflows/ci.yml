name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

# Minimal permissions; jobs that need more declare them explicitly.
permissions:
  contents: read

# Opt into Node.js 24 for JavaScript actions before the June 2, 2026 default switch.
# Removes deprecation warnings for actions/checkout@v4, actions/setup-node@v4, etc.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── .NET build + test + coverage (REQ-NFR-014: 70% line threshold) ──────────
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build SignalStack.sln -c Release

      - name: Test with coverage (per-project thresholds, target 70%)
        run: |
          dotnet test SignalStack.sln -c Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./coverage/

      - name: Upload .NET coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-coverage
          path: "**/coverage/*.xml"

  # ── Next.js lint + test + coverage (REQ-NFR-014: 60% TS threshold) ──────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test with coverage (threshold 60%)
        working-directory: apps/web
        run: npm run test:coverage

      - name: Build
        working-directory: apps/web
        run: npm run build

  # ── Dependency vulnerability scan (REQ-SEC-007) ─────────────────────────────
  # High + Critical severity findings block merge.
  dep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore .NET packages
        run: dotnet restore SignalStack.sln

      - name: .NET NuGet vulnerability audit
        run: |
          VULN=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$VULN"
          # Fail on Critical or High severity lines (output format: "> PkgName  ver  Severity  URL")
          if echo "$VULN" | grep -qE "^\s*>\s+\S+.*\s+(Critical|High)\s+https://"; then
            echo "::error::Critical or High-severity NuGet vulnerabilities detected — merge blocked (REQ-SEC-007)."
            exit 1
          fi

      - name: Node.js npm audit (high+)
        run: npm audit --audit-level=high

  # ── Secret scanning (REQ-SEC-009) ────────────────────────────────────────────
  # Scans for verified secrets committed to the branch under review.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ── FYERS SDK integrity check (REQ-ORDER-016a) ──────────────────────────────
  # Fetches the FYERS API Connect SDK from the pinned URL, computes its SHA-256
  # hash, and compares against the expected hash in the pin file. A mismatch
  # fails the build, requiring team review before the pin is updated.
  fyers-sdk-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: FYERS SDK integrity check
        run: npm --workspace @signalstack/testing run fyers-sdk-integrity

  # ── Axe-core WCAG 2.1 AA accessibility gate (REQ-ACCESS-001) ────────────────
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Axe WCAG 2.1 AA gate
        working-directory: apps/web
        run: npm run test:axe

  # ── Language review lint (REQ-LEGAL-006) ─────────────────────────────────
  # Scans user-facing source files for prohibited terms (buy, sell, recommended,
  # advised, top pick, suggested pick, signal to buy/sell).
  # First runs on the test fixture to verify the lint itself works, then on
  # the actual source to ensure no violations exist.
  language-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify lint catches test fixture violations
        run: bash scripts/language-review-lint.sh --test-fixture

      - name: Scan source for prohibited terms
        run: bash scripts/language-review-lint.sh

  # ── Contract-diff enforcement (REQ-NFR-016) ─────────────────────────────
  # Validates that all contract snapshots in packages/testing/contracts/ are
  # well-formed. When CONTRACT_API_BASE_URL is configured, also validates live
  # API responses against the contract definitions. 25 contracts registered
  # (Phase 7 — REQ-NFR-016 activated).
  contract-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: API ↔ portal contract diff
        run: npm --workspace @signalstack/testing run contract-diff
