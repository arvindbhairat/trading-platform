name: ci

# ⚠ Auto-triggers disabled to stay within GitHub Actions free-tier minutes.
# Original triggers: pull_request + push (main). Trigger manually via Actions tab → "Run workflow".

on:
  workflow_dispatch:

# Minimal permissions; jobs that need more declare them explicitly.
permissions:
  contents: read

# Opt into Node.js 24 for JavaScript actions before the June 2, 2026 default switch.
# Removes deprecation warnings for actions/checkout@v4, actions/setup-node@v4, etc.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── .NET build + test + coverage (REQ-NFR-014: 70% line threshold) ──────────
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build SignalStack.sln -c Release

      - name: Test with coverage (per-project thresholds — REQ-NFR-014, regression gate)
        run: |
          dotnet test SignalStack.sln -c Release --no-build \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput=./coverage/

      # Phase 6: Generate OpenAPI spec from the running API.
      # Starts the API briefly, fetches /openapi/v1.json, and saves as artifact.
      - name: Generate OpenAPI spec
        run: |
          # Start API in background, wait for it to be ready, fetch spec, then stop.
          cd apps/api
          dotnet run --project ../../SignalStack.sln --no-build -c Release &
          API_PID=$!
          # Wait for the API to start (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/healthz > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:5000/openapi/v1.json -o openapi.json
          kill $API_PID 2>/dev/null || true
          wait $API_PID 2>/dev/null || true

      - name: Upload OpenAPI spec
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json

      - name: Upload .NET coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-coverage
          path: "**/coverage/*.xml"

  # ── Next.js lint + test + coverage (REQ-NFR-014: 60% TS threshold) ──────────
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test with coverage (threshold 60%)
        working-directory: apps/web
        run: npm run test:coverage

      # Phase 6: Validate committed API types match the OpenAPI spec.
      # Downloads the spec artifact from the dotnet job and regenerates types,
      # then fails if the generated types differ from the committed ones.
      - name: Validate API types against OpenAPI spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: .

      - name: Regenerate and diff-check API types
        working-directory: apps/web
        run: |
          cp ../../openapi.json openapi.json
          npx openapi-typescript openapi.json -o src/lib/api-types.d.ts
          git diff --exit-code src/lib/api-types.d.ts || {
            echo "::error::Committed API types do not match the OpenAPI spec. Run 'npm run typegen:api' and commit the changes."
            exit 1
          }

      - name: Build
        working-directory: apps/web
        run: npm run build

  # ── Dependency vulnerability scan (REQ-SEC-007) ─────────────────────────────
  # High + Critical severity findings block merge.
  dep-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore .NET packages
        run: dotnet restore SignalStack.sln

      - name: .NET NuGet vulnerability audit
        run: |
          VULN=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$VULN"
          # Fail on Critical or High severity lines (output format: "> PkgName  ver  Severity  URL")
          if echo "$VULN" | grep -qE "^\s*>\s+\S+.*\s+(Critical|High)\s+https://"; then
            echo "::error::Critical or High-severity NuGet vulnerabilities detected — merge blocked (REQ-SEC-007)."
            exit 1
          fi

      - name: Node.js npm audit (high+)
        run: npm audit --audit-level=high

  # ── Secret scanning (REQ-SEC-009) ────────────────────────────────────────────
  # Scans for verified secrets committed to the branch under review.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  # ── FYERS SDK integrity check (REQ-ORDER-016a) ──────────────────────────────
  # Fetches the FYERS API Connect SDK from the pinned URL, computes its SHA-256
  # hash, and compares against the expected hash in the pin file. A mismatch
  # fails the build, requiring team review before the pin is updated.
  fyers-sdk-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: FYERS SDK integrity check
        run: npm --workspace @signalstack/testing run fyers-sdk-integrity

  # ── Axe-core WCAG 2.1 AA accessibility gate (REQ-ACCESS-001) ────────────────
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Axe WCAG 2.1 AA gate
        working-directory: apps/web
        run: npm run test:axe

  # ── Language review lint (REQ-LEGAL-006) ─────────────────────────────────
  # Scans user-facing source files for prohibited terms (buy, sell, recommended,
  # advised, top pick, suggested pick, signal to buy/sell).
  # First runs on the test fixture to verify the lint itself works, then on
  # the actual source to ensure no violations exist.
  language-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify lint catches test fixture violations
        run: bash scripts/language-review-lint.sh --test-fixture

      - name: Scan source for prohibited terms
        run: bash scripts/language-review-lint.sh

  # ── Contract-diff enforcement (REQ-NFR-016) ─────────────────────────────
  # Validates that all contract snapshots in packages/testing/contracts/ are
  # well-formed. When CONTRACT_API_BASE_URL is configured, also validates live
  # API responses against the contract definitions. 25 contracts registered
  # (Phase 7 — REQ-NFR-016 activated).
  contract-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      # Phase 6: Download the OpenAPI spec generated by the dotnet job.
      - name: Download OpenAPI spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: .

      - name: API ↔ portal contract diff (with OpenAPI validation)
        run: npm --workspace @signalstack/testing run contract-diff -- --openapi openapi.json

  # ── Playwright E2E smoke tests (P9-T1 / REQ-NFR-014) ─────────────────────
  # Runs critical-journey E2E tests through a real browser. The web app is
  # started in dev mode; the API is expected to be available (or the health
  # check test is skipped). E2E tests supplement integration coverage for
  # critical workflows per engineering-standards § Testing Standards.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Build web
        run: npm run web:build

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start web app
        run: |
          npm run web:dev &
          echo "DEV_PID=$!"
          # Wait for the dev server to be ready (up to 60s)
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null | grep -qE '^(200|302)$'; then
              echo "Web app ready on localhost:3000"
              break
            fi
            echo "Waiting for web app... ($i)"
            sleep 2
          done

      - name: Run E2E tests
        working-directory: tests/e2e
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_API_BASE_URL: http://localhost:5000
