# Deploy to Railway (Phase 1 zero-cost architecture)
#
# Deploys API and Worker services on every push to main.
# Railway knows the root directory and build type from its project config;
# this workflow triggers the build and checks the result.
#
# Prerequisites:
#   1. Railway project with API + Worker services configured
#   2. RAILWAY_TOKEN saved as a GitHub Actions secret
#   3. MONGO_CONNECTION_STRING saved as a GitHub Actions secret (used by seeder)
#   4. Environment variables set in Railway dashboard (or passed via secrets)

name: deploy-railway

# ⚠ Auto-triggers disabled to stay within GitHub Actions free-tier minutes.
# Original trigger: push (main). Trigger manually via Actions tab → "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seeder:
    name: "Run sys_config seeder"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore seed project
        run: dotnet restore apps/seed/SignalStack.Seed.csproj

      - name: Run sys_config seeder
        run: >
          dotnet run --project apps/seed/SignalStack.Seed.csproj --
          --connection-string "${{ secrets.MONGO_CONNECTION_STRING }}"
          --database "signalstack"
          --seed-version v0.3
          --override "legal.disclaimer.short_text=Disclaimer - Arvind"
          --override "legal.disclaimer.long_url=www.disclaimer.arvind.com"
          --override "orders.execution_assistance_mode_updated_at=2026-05-25T00:00:00Z"
          --override "notifications.email.sender_domain=railway.app"
          --override "notifications.email.sender_address=noreply@railway.app"
          --override "integrations.fyers.api_connect_sdk_expected_hash=30c38c3f785a11d9e5e3dd9864379d383830dd4be0462bce1a132a23c76aef4b"

  deploy-api:
    name: "Deploy API"
    runs-on: ubuntu-latest
    needs: [seeder]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Railway
        run: npx @railway/cli@latest up --service api --project ${{ vars.RAILWAY_PROJECT_ID }} --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-web:
    name: "Deploy Web"
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Web to Railway
        run: npx @railway/cli@latest up --service web --project ${{ vars.RAILWAY_PROJECT_ID }} --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-worker:
    name: "Deploy Worker"
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker to Railway
        run: npx @railway/cli@latest up --service worker --project ${{ vars.RAILWAY_PROJECT_ID }} --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  health-check:
    name: "Verify API health"
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    steps:
      - name: Wait for deployment to settle
        run: sleep 30

      - name: Check API health endpoint
        run: |
          URL="${{ vars.API_URL || 'https://api-production-b8b8f.up.railway.app' }}/api/v1/healthz"
          echo "Checking: $URL"
          for i in {1..6}; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check: PASS (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check: FAILED after 6 retries"
          exit 1
