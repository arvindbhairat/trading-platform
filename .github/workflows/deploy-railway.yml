# sys_config seeder
#
# Seeds the MongoDB sys_config collection before Railway auto-deploys.
# Build and deployment of all three services (api, worker, web) is handled
# by Railway's own GitHub integration — this workflow only runs the seeder.
#
# Prerequisites:
#   1. MONGO_CONNECTION_STRING saved as a GitHub Actions secret

name: seed-sys-config

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  seeder:
    name: "Run sys_config seeder"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore seed project
        run: dotnet restore apps/seed/SignalStack.Seed.csproj

      - name: Run sys_config seeder
        run: >
          dotnet run --project apps/seed/SignalStack.Seed.csproj --
          --connection-string "${{ secrets.MONGO_CONNECTION_STRING }}"
          --database "signalstack"
          --seed-version v0.3
          --override "legal.disclaimer.short_text=Disclaimer - Arvind"
          --override "legal.disclaimer.long_url=www.disclaimer.arvind.com"
          --override "orders.execution_assistance_mode_updated_at=2026-05-25T00:00:00Z"
          --override "notifications.email.sender_domain=railway.app"
          --override "notifications.email.sender_address=noreply@railway.app"
          --override "integrations.fyers.api_connect_sdk_expected_hash=30c38c3f785a11d9e5e3dd9864379d383830dd4be0462bce1a132a23c76aef4b"
