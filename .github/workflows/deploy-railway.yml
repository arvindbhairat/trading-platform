# Deploy to Railway (Phase 1 zero-cost architecture)
#
# Deploys API and Worker services on every push to main.
# Railway knows the root directory and build type from its project config;
# this workflow triggers the build and checks the result.
#
# Prerequisites:
#   1. Railway project with API + Worker services configured
#   2. RAILWAY_TOKEN saved as a GitHub Actions secret
#   3. Environment variables set in Railway dashboard (or passed via secrets)

name: deploy-railway

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    name: "Deploy API"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Railway
        run: cd apps/api && npx @railway/cli@latest up --service api --project ${{ vars.RAILWAY_PROJECT_ID }} --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-worker:
    name: "Deploy Worker"
    runs-on: ubuntu-latest
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Worker to Railway
        run: cd apps/worker && npx @railway/cli@latest up --service worker --project ${{ vars.RAILWAY_PROJECT_ID }} --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  health-check:
    name: "Verify API health"
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    steps:
      - name: Wait for deployment to settle
        run: sleep 30

      - name: Check API health endpoint
        run: |
          URL="${{ vars.API_URL || 'https://api-production.up.railway.app' }}/api/v1/healthz"
          echo "Checking: $URL"
          for i in {1..6}; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check: PASS (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check: FAILED after 6 retries"
          exit 1
