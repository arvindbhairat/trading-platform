name: signalstack-local

services:
  otel-collector-primary:
    image: otel/opentelemetry-collector-contrib:0.102.1
    container_name: signalstack-otel-primary
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "${OTEL_PRIMARY_GRPC_PORT:-4317}:4317"
      - "${OTEL_PRIMARY_HTTP_PORT:-4318}:4318"
    volumes:
      - ./otel/collector-primary-config.yaml:/etc/otelcol/config.yaml:ro
      - otel_primary_data:/var/lib/otelcol

  otel-collector-fallback:
    image: otel/opentelemetry-collector-contrib:0.102.1
    container_name: signalstack-otel-fallback
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "${OTEL_FALLBACK_GRPC_PORT:-14317}:4317"
      - "${OTEL_FALLBACK_HTTP_PORT:-14318}:4318"
    volumes:
      - ./otel/collector-fallback-config.yaml:/etc/otelcol/config.yaml:ro
      - otel_fallback_data:/var/lib/otelcol

  mongo:
    image: mongo:7
    container_name: signalstack-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: signalstack-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: postgres:16
    container_name: signalstack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: signalstack_marketdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  otel_primary_data:
  otel_fallback_data:
  mongo_data:
  redis_data:
  postgres_data:
