name: signalstack-local

services:
  otel-collector-primary:
    image: otel/opentelemetry-collector-contrib:0.102.1
    container_name: signalstack-otel-primary
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "${OTEL_PRIMARY_GRPC_PORT:-4317}:4317"
      - "${OTEL_PRIMARY_HTTP_PORT:-4318}:4318"
    volumes:
      - ./otel/collector-primary-config.yaml:/etc/otelcol/config.yaml:ro
      - otel_primary_data:/var/lib/otelcol

  otel-collector-fallback:
    image: otel/opentelemetry-collector-contrib:0.102.1
    container_name: signalstack-otel-fallback
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "${OTEL_FALLBACK_GRPC_PORT:-14317}:4317"
      - "${OTEL_FALLBACK_HTTP_PORT:-14318}:4318"
    volumes:
      - ./otel/collector-fallback-config.yaml:/etc/otelcol/config.yaml:ro
      - otel_fallback_data:/var/lib/otelcol

  mongo:
    image: mongo:7
    container_name: signalstack-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: signalstack-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: signalstack-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA:-Y}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\" -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  otel_primary_data:
  otel_fallback_data:
  mongo_data:
  redis_data:
  mssql_data:
